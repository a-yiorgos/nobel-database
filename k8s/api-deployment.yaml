apiVersion: apps/v1
kind: Deployment
metadata:
  name: nobel-api
  labels:
    app.kubernetes.io/name: nobel-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: nobel-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nobel-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nobel-api
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: nobel-app
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 0
      volumes:
        - name: shared-data
          emptyDir: {}
      initContainers:
        - name: downloader
          image: nobel-downloader:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_PATH
              value: /data/nobel.db
          volumeMounts:
            - name: shared-data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
      containers:
        - name: backend
          image: nobel-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DB_PATH
              value: /data/nobel.db
          volumeMounts:
            - name: shared-data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nobel-api-service
  labels:
    app.kubernetes.io/name: nobel-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: nobel-app
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: nobel-api
